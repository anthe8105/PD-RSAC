environment: {num_vehicles: 1000, num_stations: 35}
episode: {duration_hours: 12.0, step_duration_minutes: 5}
data:
  processed_root: ../data/processed
  datasets: [yellow_tripdata_2009-01, yellow_tripdata_2009-12]
  manifest_path: ../data/manifests/nyc_r7_v3.json
  h3_resolution: 7
  sample_ratio: 0.12
  sample_seed: 2009
  splits:
    train: ['2009-01-02', '2009-01-22']
    val: ['2009-01-22', '2009-01-25']
    test: ['2009-01-25', '2009-02-01']
    nye: ['2009-12-31', '2010-01-01']
reward: {driving_cost_per_km: 0.3, electricity_cost_per_kwh: 0.18, wait_penalty_per_step: 0.03, drop_penalty_per_order: 0.5,
  scale_factor: 100.0, max_wait_steps: 6}
physics: {battery_kwh: 50.0, reserve_kwh: 7.5, energy_per_km: 0.2, charge_efficiency: 0.95, avg_speed_kmh: 25.0}
vehicle: {initial_energy_range: [0.5, 0.9], low_energy_fraction: 0.2}
station: {num_ports: 5, max_power: 50.0, min_power: 20.0, feeder_kw: 5500.0, cover_rings: 2, cover_min_daily_pickups: 1.0}
milp: {mu: 4.0, tau_max: 0.5, warm_start: true, threads: 0, strict: true}
